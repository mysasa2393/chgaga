<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 開學季歡樂開獎看板 🎒</title>
  <style>
    /* ----- 開學季主題 (文具綠 + 活力橘) v1 ----- */
    :root {
      --bg-color: #fefce8; 
      --card-bg: #ffffff;
      --primary-green: #16a34a;
      --primary-orange: #f97316;
      --gold: #fbc02d;
      --text-color: #4b5563; 
    }

    body {
      background: linear-gradient(180deg, #fefce8 0%, #ecfdf5 100%);
      color: var(--text-color);
      font-family: "微軟正黑體", "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 標題裝飾 */
    h1 {
      color: var(--primary-green);
      font-size: 3em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 0px #fff, 4px 4px 10px rgba(0,0,0,0.1);
      position: relative;
      z-index: 10;
    }
    h1::after {
      content: "🎒"; font-size: 0.6em; position: absolute;
      top: -10px; right: -50px; animation: swing 2s infinite ease-in-out;
    }

    /* 儀表板佈局 */
    .dashboard {
      display: flex; flex-wrap: wrap; gap: 25px;
      width: 100%; max-width: 1200px;
      justify-content: center; align-items: flex-start;
      z-index: 10; 
    }

    .left-panel { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 25px; }
    .right-panel { flex: 1.5; min-width: 350px; display: flex; flex-direction: column; height: 650px; }

    /* 通用卡片樣式 */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(82, 130, 166, 0.15);
      border: 2px solid #fff;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
      background: repeating-linear-gradient(45deg, var(--primary-green), var(--primary-green) 10px, #fff 10px, #fff 20px);
    }

    /* 總數卡片 */
    .stat-title { font-size: 20px; color: #6b7280; margin-bottom: 5px; font-weight: bold; }
    .stat-number {
      font-size: 90px; font-weight: 900; color: var(--primary-orange);
      margin: 10px 0; text-shadow: 2px 2px 0px #fff7ed; font-family: 'Arial Black', sans-serif;
    }
    
    .live-status {
      display: inline-flex; align-items: center;
      background: #ecfdf5; color: var(--primary-green);
      padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold;
    }
    .live-dot {
      width: 10px; height: 10px; background: var(--primary-green);
      border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite;
    }

    /* 分類統計 */
    .breakdown-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px;
    }
    .prize-mini-card {
      background: #fff7ed; padding: 15px; border-radius: 12px; text-align: center;
      border: 1px solid #fed7aa;
    }
    .prize-name { font-size: 14px; color: #9a3412; margin-bottom: 5px; }
    .prize-count { font-size: 24px; color: var(--primary-green); font-weight: bold; }

    /* 右側列表 */
    .panel-header {
      font-size: 22px; font-weight: bold; color: var(--primary-green);
      margin-bottom: 15px; padding-bottom: 10px;
      border-bottom: 2px dashed #bbf7d0;
      display: flex; align-items: center; gap: 10px;
    }
    .log-list {
      list-style: none; padding: 0; margin: 0;
      overflow-y: auto; flex: 1; padding-right: 5px;
    }
    .log-list::-webkit-scrollbar { width: 6px; }
    .log-list::-webkit-scrollbar-thumb { background: #bbf7d0; border-radius: 3px; }

    .log-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px; margin-bottom: 10px;
      background: #fff; border-radius: 10px;
      border-left: 5px solid var(--gold);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      /* 移除動畫，解決閃爍問題 */
      /* animation: slideIn 0.5s ease; */ 
    }
    .log-time { color: #999; font-size: 13px; font-family: monospace; }
    .log-user { color: #333; font-weight: bold; flex: 1; margin-left: 15px; font-size: 16px; }
    .log-prize { 
      color: var(--primary-orange); font-weight: bold; 
      background: #fff7ed; padding: 5px 10px; border-radius: 15px; font-size: 14px;
    }

    /* 飄落文具特效 (取代雪花) */
    .snowflake {
      position: fixed; top: -10px; z-index: 1;
      text-shadow: 0 0 5px rgba(0,0,0,0.1);
      animation: fall linear infinite; pointer-events: none;
    }

    @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes swing { 0% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 75% { transform: rotate(-10deg); } 100% { transform: rotate(0deg); } }

    /* RWD */
    @media (max-width: 768px) {
      h1 { font-size: 2em; }
      .stat-number { font-size: 60px; }
      .right-panel { height: 500px; }
    }
  </style>
</head>
<body>

  <h1>📚 開學季歡樂開獎看板 🎒</h1>

  <div class="dashboard">
    
    <div class="left-panel">
      <div class="card" style="text-align: center;">
        <div class="stat-title">📅 今日已送出獎品</div>
        <div class="stat-number" id="countDisplay">0</div>
        <div class="live-status">
          <span class="live-dot"></span> 即時連線中
        </div>
      </div>

      <div class="card">
        <div class="panel-header">📊 獎品派發狀況</div>
        <div class="breakdown-grid" id="breakdownGrid">
          <div style="color:#999; font-size:14px; grid-column:1/-1; text-align:center;">載入中...</div>
        </div>
      </div>
    </div>

    <div class="right-panel card">
      <div class="panel-header">📝 最新幸運兒名單</div>
      <ul class="log-list" id="logList">
        <li style="text-align:center; padding:20px; color:#999;">等待新學期好運降臨中...</li>
      </ul>
    </div>

  </div>

  <script>
    // ⚠️ 請填入你的 GAS 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxHEwjdt1URWlRsDpuZFn-Mgqi62l_vSjtAa9up21d37UblgtnNPQgmW3SkDZTe_S2jtw/exec";

    const countDisplay = document.getElementById("countDisplay");
    const logList = document.getElementById("logList");
    const breakdownGrid = document.getElementById("breakdownGrid");
    
    // 儲存上一次的列表 HTML，用來比對是否需要更新
    let lastLogHtml = "";

    createFloatingItems();
    fetchData();
    setInterval(fetchData, 5000);

    function fetchData() {
      fetch(`${GAS_API_URL}?action=getDashboard`)
        .then(res => res.json())
        .then(data => {
          updateUI(data);
        })
        .catch(err => console.error("Update failed", err));
    }

    function updateUI(data) {
      // 1. 更新總數 (只有數字變了才跳動)
      const currentCount = parseInt(countDisplay.innerText);
      if (currentCount !== data.todayCount) {
        countDisplay.innerText = data.todayCount;
        countDisplay.style.transform = "scale(1.1)";
        setTimeout(() => countDisplay.style.transform = "scale(1)", 200);
      }

      // 2. 更新分類
      updateBreakdown(data.prizeCounts);

      // 3. 更新列表 (防閃爍核心邏輯)
      updateLogList(data.recentLogs);
    }

    function updateBreakdown(counts) {
      if (!counts || Object.keys(counts).length === 0) {
        breakdownGrid.innerHTML = '<div style="color:#aaa; font-size:14px; grid-column:1/-1; text-align:center;">今日尚無獎品送出</div>';
        return;
      }
      const sortedPrizes = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      let html = "";
      sortedPrizes.forEach(([name, count]) => {
        html += `
          <div class="prize-mini-card">
            <div class="prize-name">${name}</div>
            <div class="prize-count">${count}</div>
          </div>
        `;
      });
      breakdownGrid.innerHTML = html;
    }

    function updateLogList(logs) {
      if (logs.length === 0) {
        logList.innerHTML = '<li style="text-align:center; padding:40px; color:#aaa;">今日尚無紀錄</li>';
        return;
      }
      
      let html = "";
      logs.forEach(log => {
        html += `
          <li class="log-item">
            <span class="log-time">${log.time}</span>
            <span class="log-user">${log.code}</span>
            <span class="log-prize">🎁 ${log.prize}</span>
          </li>
        `;
      });

      // 關鍵修改：只有當內容真的不一樣時，才寫入 DOM
      // 這能防止瀏覽器重新渲染造成的閃爍
      if (html !== lastLogHtml) {
        logList.innerHTML = html;
        lastLogHtml = html; // 更新快取
      }
    }

    function createFloatingItems() {
      // 開學季飄落文具/書本符號 (取代原本的雪花)
      const symbols = ['📚', '✏️', '📝', '🎒', '📐'];
      setInterval(() => {
        const item = document.createElement('div');
        item.classList.add('snowflake');
        item.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        item.style.left = Math.random() * 100 + 'vw';
        item.style.animationDuration = Math.random() * 3 + 5 + 's'; 
        item.style.opacity = Math.random() * 0.6 + 0.4;
        item.style.fontSize = Math.random() * 10 + 14 + 'px';
        document.body.appendChild(item);
        setTimeout(() => { item.remove(); }, 10000);
      }, 400);
    }
  </script>

</body>
</html>
